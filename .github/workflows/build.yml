name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Android SDK: $ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Logic tests (:core)
        run: set -o pipefail; ./gradlew :core:test 2>&1 | tee -a build.log

      - name: Settings persistence test (:app)
        run: set -o pipefail; ./gradlew :app:testDebugUnitTest 2>&1 | tee -a build.log

      - name: Build debug APK
        run: set -o pipefail; ./gradlew assembleDebug 2>&1 | tee -a build.log

      - name: Report errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|> .*failed|Exception|Expected|but was" build.log | head -60 > errors.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt)
          echo "::error title=Build errors::${msg}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scrollmate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
